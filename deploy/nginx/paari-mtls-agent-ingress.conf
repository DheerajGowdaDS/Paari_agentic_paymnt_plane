# Dedicated mTLS-only listener for external-agent payment-intent ingress.
# Do not expose the Paari application port publicly. The app trusts the
# X-Paari-Mtls-* headers only from this proxy's narrowly-defined network.
upstream paari_api_internal {
    server app:8000;
    keepalive 32;
}

server {
    listen 8443 ssl;
    server_name agent-gateway.local;

    ssl_certificate     /etc/nginx/mtls/server.crt;
    ssl_certificate_key /etc/nginx/mtls/server.key;
    ssl_client_certificate /etc/nginx/mtls/ca.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:PaariMTLS:10m;
    ssl_session_timeout 10m;

    client_max_body_size 64k;

    location = /v1/payments/intent {
        proxy_pass http://paari_api_internal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Paari-Mtls-Verify $ssl_client_verify;
        proxy_set_header X-Paari-Mtls-Certificate $ssl_client_escaped_cert;
        proxy_set_header X-Paari-Mtls-Subject $ssl_client_s_dn;
    }

    location = /payments/intent {
        proxy_pass http://paari_api_internal;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Paari-Mtls-Verify $ssl_client_verify;
        proxy_set_header X-Paari-Mtls-Certificate $ssl_client_escaped_cert;
        proxy_set_header X-Paari-Mtls-Subject $ssl_client_s_dn;
    }

    location / { return 404; }
}
