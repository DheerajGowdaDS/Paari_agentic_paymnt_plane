name: paari-v40

# Production-oriented self-hosted reference topology.
# Terminate public TLS and WAF at a managed ingress/load balancer. The API is
# bound to loopback on the host by default and is not exposed directly to the
# public Internet. Inject .env.production from a secret manager; do not commit it.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paari}
      POSTGRES_USER: ${POSTGRES_USER:-paari}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD through your secret manager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [paari_internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - ../../.env.production
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks: [paari_internal]
    restart: "no"

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - ../../.env.production
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers"]
    environment:
      PAARI_RECONCILE_EMBEDDED_WORKER: "0"
      PAARI_REQUIRE_TREASURY_BUDGET: "1"
      PAARI_REQUIRE_RECEIVER_PRECHECK: "1"
    ports:
      - "127.0.0.1:8000:8000"
    secrets:
      - paari_agent_ca
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [paari_internal]
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 45s

  reconcile-worker:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - ../../.env.production
    command: ["python", "-m", "app.worker"]
    environment:
      PAARI_REQUIRE_TREASURY_BUDGET: "1"
      PAARI_REQUIRE_RECEIVER_PRECHECK: "1"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks: [paari_internal]
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    secrets:
      - paari_agent_ca
    restart: unless-stopped

secrets:
  paari_agent_ca:
    file: ./secrets/paari_agent_ca.crt

networks:
  paari_internal:
    driver: bridge

volumes:
  postgres_data:
