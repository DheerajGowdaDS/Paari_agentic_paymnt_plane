# Optional local-only mTLS gateway profile:
#   python scripts/mtls_pki.py init --out ./local_pki
#   docker compose -f docker-compose.yml -f docker-compose.mtls.yml up -d --build
# This overlay is a sandbox integration harness, not a production PKI setup.
services:
  app:
    # Preserve the actual TCP peer (the gateway container) in ASGI scope.client.
    # ProxyHeadersMiddleware must not rewrite it from an X-Forwarded-For header,
    # because Paari's ingress trust check authenticates the connecting proxy.
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --no-proxy-headers"]
    environment:
      - PAARI_REQUIRE_MTLS_INGRESS=1
      - PAARI_MTLS_CA_CERT=/app/mtls/ca.crt
      - PAARI_MTLS_TRUSTED_PROXY_CIDRS=172.29.0.20/32
      - PAARI_KYB_SIMULATION=1
    volumes:
      - ./local_pki/ca.crt:/app/mtls/ca.crt:ro
    networks:
      paari_mtls:
        ipv4_address: 172.29.0.10
  db:
    networks:
      paari_mtls:
        ipv4_address: 172.29.0.30
  gateway:
    # Stable NGINX 1.30 branch; update and pin an approved digest for deployments.
    image: nginx:1.30-alpine
    depends_on:
      app:
        condition: service_started
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./deploy/nginx/paari-mtls-agent-ingress.conf:/etc/nginx/conf.d/default.conf:ro
      - ./local_pki/ca.crt:/etc/nginx/mtls/ca.crt:ro
      - ./local_pki/server.crt:/etc/nginx/mtls/server.crt:ro
      - ./local_pki/server.key:/etc/nginx/mtls/server.key:ro
    networks:
      paari_mtls:
        ipv4_address: 172.29.0.20
    restart: unless-stopped

networks:
  paari_mtls:
    ipam:
      config:
        - subnet: 172.29.0.0/24
